name: One-Time Astro Static Path Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix getStaticPaths scope
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/services/[slug].astro')
          text = p.read_text()
          old = "const retiredServiceSlugs = new Set([\n  'drain-repair',\n  'washing-machine-basement-flooding',\n  'kitchen-bathroom-drains',\n]);\n\nexport function getStaticPaths() {\n  return services\n    .filter((service) => !retiredServiceSlugs.has(service.slug))\n    .map((service) => ({ params: { slug: service.slug }, props: { service } }));\n}"
          new = "export function getStaticPaths() {\n  const retiredServiceSlugs = new Set([\n    'drain-repair',\n    'washing-machine-basement-flooding',\n    'kitchen-bathroom-drains',\n  ]);\n\n  return services\n    .filter((service) => !retiredServiceSlugs.has(service.slug))\n    .map((service) => ({ params: { slug: service.slug }, props: { service } }));\n}"
          if old not in text:
              raise SystemExit('Expected static path block not found')
          p.write_text(text.replace(old, new, 1))
          Path('.github/workflows/fix-static-paths-scope.yml').unlink()
          PY

      - name: Validate
        run: |
          grep -n "const retiredServiceSlugs" src/pages/services/[slug].astro
          ! grep -R "/services/kitchen-bathroom-drains/" src/pages src/data

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'src/pages/services/[slug].astro' '.github/workflows/fix-static-paths-scope.yml'
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Astro static path scope'
          git push
