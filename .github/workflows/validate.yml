name: Validate Astro site

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Astro type and content check
        run: npm run check
      - name: Install production image optimizer
        run: npm install sharp --no-save --ignore-scripts --no-audit --no-fund
      - name: Build Astro site
        run: npm run build
      - name: Apply production HTML and JSON-LD corrections
        run: node scripts/remove-keyword-stuffing-blocks.mjs
      - name: Optimize deployed images
        run: node scripts/optimize-deployed-images.mjs
      - name: Validate generated routes, schema, internal links, and sitemap
        run: node scripts/prune-retired-routes.mjs
