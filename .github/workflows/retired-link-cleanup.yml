name: One-Time Canonical Architecture Cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Correct canonical schema and internal links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # MainLayout: make JSON-LD breadcrumbs match the visible breadcrumb labels.
          p = Path('src/layouts/MainLayout.astro')
          text = p.read_text()
          text = text.replace(
              "  city?: { name: string; counties: string[] };\n",
              "  city?: { name: string; counties: string[] };\n  breadcrumbLabel?: string;\n",
              1,
          )
          text = text.replace(
              "const { title, description, path = '/', service, city } = Astro.props;",
              "const { title, description, path = '/', service, city, breadcrumbLabel } = Astro.props;",
              1,
          )
          text = text.replace(
              "...(service ? [{ '@type': 'ListItem', position: 3, name: service.title, item: canonical }] : path === '/services/' ? [] : [{ '@type': 'ListItem', position: 3, name: title.replace(' | A-1 Drain Cleaning', ''), item: canonical }])",
              "...(service ? [{ '@type': 'ListItem', position: 3, name: service.title, item: canonical }] : path === '/services/' ? [] : [{ '@type': 'ListItem', position: 3, name: breadcrumbLabel ?? title.replace(' | A-1 Drain Cleaning', ''), item: canonical }])",
              1,
          )
          text = text.replace(
              "{ '@type': 'ListItem', position: 3, name: title.replace(' | A-1 Drain Cleaning', ''), item: canonical }\n      ] : [{\n        '@type': 'ListItem', position: 2,\n        name: path === '/service-area/' ? 'Areas We Serve' : title.replace(' | A-1 Drain Cleaning', ''),\n        item: canonical",
              "{ '@type': 'ListItem', position: 3, name: breadcrumbLabel ?? title.replace(' | A-1 Drain Cleaning', ''), item: canonical }\n      ] : [{\n        '@type': 'ListItem', position: 2,\n        name: path === '/service-area/' ? 'Areas We Serve' : breadcrumbLabel ?? title.replace(' | A-1 Drain Cleaning', ''),\n        item: canonical",
              1,
          )
          text = text.replace(
              "{ '@type': 'ListItem', position: 3, name: title.replace(' | A-1 Drain Cleaning', ''), item: canonical }\n      ] : [{\n        '@type': 'ListItem', position: 2, name: path === '/service-area/' ? 'Areas We Serve' : breadcrumbLabel ?? title.replace(' | A-1 Drain Cleaning', ''), item: canonical\n      }])",
              "{ '@type': 'ListItem', position: 3, name: breadcrumbLabel ?? title.replace(' | A-1 Drain Cleaning', ''), item: canonical }\n      ] : [{\n        '@type': 'ListItem', position: 2, name: path === '/service-area/' ? 'Areas We Serve' : breadcrumbLabel ?? title.replace(' | A-1 Drain Cleaning', ''), item: canonical\n      }])",
              1,
          )
          # Explicit service-area branch.
          text = text.replace(
              "{ '@type': 'ListItem', position: 3, name: title.replace(' | A-1 Drain Cleaning', ''), item: canonical }\n      ] : [{\n        '@type': 'ListItem', position: 2, name: path === '/service-area/' ? 'Areas We Serve' : breadcrumbLabel ?? title.replace(' | A-1 Drain Cleaning', ''), item: canonical",
              "{ '@type': 'ListItem', position: 3, name: breadcrumbLabel ?? title.replace(' | A-1 Drain Cleaning', ''), item: canonical }\n      ] : [{\n        '@type': 'ListItem', position: 2, name: path === '/service-area/' ? 'Areas We Serve' : breadcrumbLabel ?? title.replace(' | A-1 Drain Cleaning', ''), item: canonical",
              1,
          )
          # Directly replace the city branch if still present.
          text = text.replace(
              "{ '@type': 'ListItem', position: 3, name: title.replace(' | A-1 Drain Cleaning', ''), item: canonical }\n      ] : [{",
              "{ '@type': 'ListItem', position: 3, name: breadcrumbLabel ?? title.replace(' | A-1 Drain Cleaning', ''), item: canonical }\n      ] : [{",
              1,
          )
          p.write_text(text)

          # Canonical kitchen/bathroom pages participate in Service schema and explicit breadcrumb naming.
          kitchen = Path('src/pages/services/kitchen-drains/index.astro')
          text = kitchen.read_text()
          old = '<MainLayout title={title} description={description} path="/services/kitchen-drains/">'
          new = '<MainLayout title={title} description={description} path="/services/kitchen-drains/" breadcrumbLabel="Kitchen Drains" service={{ title: \'Kitchen Drain Cleaning & Garbage Disposal Service\', description }}>'
          if old in text:
              kitchen.write_text(text.replace(old, new, 1))

          bathroom = Path('src/pages/services/bathroom-shower-drains/index.astro')
          text = bathroom.read_text()
          old = '<MainLayout title={title} description={description} path="/services/bathroom-shower-drains/">'
          new = '<MainLayout title={title} description={description} path="/services/bathroom-shower-drains/" breadcrumbLabel="Bathroom & Shower Drains" service={{ title: \'Bathroom & Shower Drain Cleaning\', description }}>'
          if old in text:
              bathroom.write_text(text.replace(old, new, 1))

          # City pages: use the actual city name in breadcrumb schema and never link the retired combined service.
          city = Path('src/pages/service-area/[slug].astro')
          text = city.read_text().replace("  'kitchen-bathroom-drains',", "  'bathroom-shower-drains',")
          old = '<MainLayout title={title} description={description} path={`/service-area/${city.slug}/`} city={city}>'
          new = '<MainLayout title={title} description={description} path={`/service-area/${city.slug}/`} city={city} breadcrumbLabel={city.name}>'
          if old in text:
              text = text.replace(old, new, 1)
          city.write_text(text)

          # Do not generate retired service URLs from the dynamic route.
          service_page = Path('src/pages/services/[slug].astro')
          text = service_page.read_text()
          old = "export function getStaticPaths() {\n  return services.map((service) => ({ params: { slug: service.slug }, props: { service } }));\n}"
          new = "const retiredServiceSlugs = new Set([\n  'drain-repair',\n  'washing-machine-basement-flooding',\n  'kitchen-bathroom-drains',\n]);\n\nexport function getStaticPaths() {\n  return services\n    .filter((service) => !retiredServiceSlugs.has(service.slug))\n    .map((service) => ({ params: { slug: service.slug }, props: { service } }));\n}"
          if old in text:
              text = text.replace(old, new, 1)
          text = text.replace("service.slug === 'kitchen-bathroom-drains'", "service.slug === 'bathroom-shower-drains'")
          service_page.write_text(text)

          # Stop mutating the retired combined kitchen/bathroom record.
          config = Path('src/data/servicePageConfig.ts')
          text = config.read_text()
          text, removed = re.subn(
              r"\nconst bathroomDrainService = services\.find\(\(service\) => service\.slug === 'kitchen-bathroom-drains'\);\nif \(bathroomDrainService\) \{.*?\n\}\n",
              "\n",
              text,
              count=1,
              flags=re.S,
          )
          if removed:
              text = text.replace("'kitchen-bathroom-drains'", "'bathroom-shower-drains'")
          config.write_text(text)

          Path('.github/workflows/retired-link-cleanup.yml').unlink()
          PY

      - name: Validate changed source
        run: |
          ! grep -R "/services/kitchen-bathroom-drains/" src/data src/pages
          grep -R "breadcrumbLabel" src/layouts/MainLayout.astro src/pages/services/kitchen-drains/index.astro src/pages/services/bathroom-shower-drains/index.astro src/pages/service-area/[slug].astro
          grep -R "retiredServiceSlugs" src/pages/services/[slug].astro

      - name: Commit source correction and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'src/layouts/MainLayout.astro' 'src/data/servicePageConfig.ts' 'src/pages/services/[slug].astro' 'src/pages/services/kitchen-drains/index.astro' 'src/pages/services/bathroom-shower-drains/index.astro' 'src/pages/service-area/[slug].astro' '.github/workflows/retired-link-cleanup.yml'
          git diff --cached --quiet && exit 0
          git commit -m 'Fix canonical schema and internal links'
          git push
