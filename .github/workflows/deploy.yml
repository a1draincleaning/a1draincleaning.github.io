name: Deploy Astro site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The repository currently has no committed package-lock.json.
      # Generate one before withastro/action detects the npm package manager.
      - name: Set up Node for lockfile generation
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate npm lockfile for this build
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies, validate, build, and upload the site
        uses: withastro/action@v6
        with:
          node-version: 22
          build-cmd: >-
            npm test &&
            npm run check &&
            npm install sharp --no-save --ignore-scripts --no-audit --no-fund &&
            npm run build &&
            node scripts/remove-keyword-stuffing-blocks.mjs &&
            node scripts/optimize-deployed-images.mjs &&
            node scripts/prune-retired-routes.mjs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
