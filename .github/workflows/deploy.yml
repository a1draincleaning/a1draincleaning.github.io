name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install image optimizer
        run: npm install sharp --no-save --ignore-scripts --no-audit --no-fund

      - name: Check Astro project
        run: npm run check

      - name: Build Astro site
        run: npm run build

      - name: Remove generated keyword-list blocks
        run: node scripts/remove-keyword-stuffing-blocks.mjs

      - name: Optimize oversized deployed images
        run: node scripts/optimize-deployed-images.mjs

      - name: Remove retired duplicate routes
        run: node scripts/prune-retired-routes.mjs

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Checkout source for changed-file detection
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Submit changed pages to IndexNow
        env:
          INDEXNOW_KEY: a1d1e0c9b7f34a6d8c2e5f9017b3a4c6
          SITE_URL: https://a1draincleaning.github.io
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';

          const site = process.env.SITE_URL;
          const key = process.env.INDEXNOW_KEY;
          const before = process.env.BEFORE_SHA;
          const current = process.env.CURRENT_SHA;
          let changed = [];

          if (before && !/^0+$/.test(before)) {
            execFileSync('git', ['fetch', '--no-tags', 'origin', before], { stdio: 'inherit' });
            changed = execFileSync('git', ['diff', '--name-only', before, current], { encoding: 'utf8' })
              .split(/\r?\n/).filter(Boolean);
          } else {
            changed = ['src/pages/'];
          }

          const affectsPages = changed.some(path =>
            /^(src\/pages\/|src\/data\/|src\/content\/|astro\.config\.|public\/)/.test(path)
          );

          if (!affectsPages) {
            console.log('No page, content, configuration, or public-file changes; skipping IndexNow.');
            process.exit(0);
          }

          const sitemapIndexResponse = await fetch(site + '/sitemap-index.xml');
          if (!sitemapIndexResponse.ok) throw new Error('Sitemap index returned HTTP ' + sitemapIndexResponse.status);
          const sitemapIndex = await sitemapIndexResponse.text();
          const sitemapUrls = [...sitemapIndex.matchAll(/<loc>([^<]+)<\/loc>/g)].map(match => match[1]);
          const urls = new Set();

          for (const sitemapUrl of sitemapUrls) {
            const response = await fetch(sitemapUrl);
            if (!response.ok) throw new Error('Sitemap returned HTTP ' + response.status + ': ' + sitemapUrl);
            const xml = await response.text();
            for (const match of xml.matchAll(/<loc>([^<]+)<\/loc>/g)) {
              const url = match[1].trim();
              if (new URL(url).origin === new URL(site).origin) urls.add(url);
            }
          }

          const urlList = [...urls];
          if (!urlList.length) throw new Error('No site URLs found in the sitemap.');
          if (urlList.length > 10000) throw new Error('Sitemap exceeds IndexNow batch limit; split submissions.');

          const response = await fetch('https://api.indexnow.org/indexnow', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json; charset=utf-8' },
            body: JSON.stringify({
              host: new URL(site).host,
              key,
              keyLocation: site + '/' + key + '.txt',
              urlList
            })
          });

          console.log('IndexNow response:', response.status, response.statusText);
          if (![200, 202].includes(response.status)) {
            throw new Error('IndexNow submission failed with HTTP ' + response.status + ': ' + await response.text());
          }
          console.log('Submitted ' + urlList.length + ' sitemap URLs to IndexNow.');
          NODE
