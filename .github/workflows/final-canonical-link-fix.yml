name: One-Time Canonical Link Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix canonical service link fallbacks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # City service cards must use a real canonical page even though the
          # legacy combined service record remains in compatibility data.
          p = Path('src/pages/service-area/[slug].astro')
          text = p.read_text()
          old = "const coreServices = services.filter((service) => [\n  'main-drain-cleaning',\n  'sewer-line-cleaning',\n  'tree-roots-in-sewer-line',\n  'basement-floor-drains',\n  'bathroom-shower-drains',\n  'toilet-clogs',\n  'laundry-drains',\n  'sewer-backup-emergency',\n  'hydro-jetting'\n].includes(service.slug));"
          new = "const coreServiceSlugs = [\n  'main-drain-cleaning',\n  'sewer-line-cleaning',\n  'tree-roots-in-sewer-line',\n  'basement-floor-drains',\n  'toilet-clogs',\n  'laundry-drains',\n  'sewer-backup-emergency',\n  'hydro-jetting'\n];\nconst coreServices = [\n  ...services.filter((service) => coreServiceSlugs.includes(service.slug)),\n  {\n    slug: 'bathroom-shower-drains',\n    title: 'Bathroom & Shower Drains',\n    description: 'Bathroom sink, shower, and bathtub drain cleaning for slow, clogged, or backing-up drains.'\n  }\n];"
          if old not in text:
              raise SystemExit('Expected city core service block not found')
          p.write_text(text.replace(old, new, 1))

          # Dynamic service pages may reference the canonical static kitchen or
          # bathroom pages from related-service data. Provide lightweight link
          # records instead of reviving the retired combined route.
          p = Path('src/pages/services/[slug].astro')
          text = p.read_text()
          old = "const relatedServices = (relatedServiceSlugs[service.slug] || [])\n  .map((slug) => services.find((item) => item.slug === slug))\n  .filter((item): item is typeof services[number] => Boolean(item));"
          new = "const canonicalServiceLinks = new Map([\n  ['kitchen-drains', { slug: 'kitchen-drains', title: 'Kitchen Drains' }],\n  ['bathroom-shower-drains', { slug: 'bathroom-shower-drains', title: 'Bathroom & Shower Drains' }],\n]);\nconst relatedServices = (relatedServiceSlugs[service.slug] || [])\n  .map((slug) => services.find((item) => item.slug === slug) ?? canonicalServiceLinks.get(slug))\n  .filter((item): item is { slug: string; title: string } => Boolean(item));"
          if old not in text:
              raise SystemExit('Expected related service block not found')
          p.write_text(text.replace(old, new, 1))

          Path('.github/workflows/final-canonical-link-fix.yml').unlink()
          PY

      - name: Validate
        run: |
          grep -n "bathroom-shower-drains" src/pages/service-area/[slug].astro src/pages/services/[slug].astro
          ! grep -R "/services/kitchen-bathroom-drains/" src/pages src/data

      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'src/pages/service-area/[slug].astro' 'src/pages/services/[slug].astro' '.github/workflows/final-canonical-link-fix.yml'
          git diff --cached --quiet && exit 0
          git commit -m 'Use canonical service links'
          git push
